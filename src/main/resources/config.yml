# ─────────────────────────────────────────────────────────────
#  Vertexx — configuração principal
#  Novas opções são adicionadas automaticamente a cada atualização.
# ─────────────────────────────────────────────────────────────

chat:
  # Mostra o símbolo do reino antes do nome no chat e no TAB.
  kingdom-tag: true

onboarding:
  # cutscene = cerimônia cinematográfica dos 3 bandeirões | menu = menu de inventário clássico.
  mode: cutscene
  # Ticks de espera após o login antes de abrir o menu de escolha de reino (modo menu).
  open-delay-ticks: 40

waystones:
  # Um Waystone é criado ao colocar um Lodestone RENOMEADO na bigorna.
  # Limite por jogador (-1 = sem limite).
  max-per-player: 3
  name-max-length: 32
  # Tempo de concentração antes do teletransporte (20 ticks = 1 segundo).
  warmup-ticks: 30
  ambient-particles: true
  cost:
    # ITEM | XP_LEVELS | NONE
    type: ITEM
    # Itens aceitos e a quantidade de cada um. Cada jogador escolhe qual usar no menu do Waystone.
    options:
      AMETHYST_SHARD: 1
      ENDER_PEARL: 1
      RESIN_CLUMP: 2
    # Item usado por quem ainda não escolheu.
    default: AMETHYST_SHARD
    # Usado quando type = XP_LEVELS.
    xp-levels: 1
  # Modelo 3D (display entities) sobre o Lodestone.
  model:
    enabled: true
    # Distância em blocos para criar o modelo e enviá-lo ao jogador.
    render-distance: 48
    # Sem jogador a esta distância, as entidades são removidas do mundo.
    despawn-distance: 96
    # Não envia o modelo a quem está de costas para ele.
    fov-culling: true
    # Não envia o modelo a quem tem uma parede no meio do caminho.
    occlusion-culling: true
    # Frequência da checagem de visibilidade (ticks).
    check-interval-ticks: 10
    # Animação de montagem ao colocar um novo Waystone.
    assembly-animation: true

graves:
  enabled: true
  # Por quantos minutos só o dono (ou alguém com uma Chave de Túmulo) pode abrir o túmulo.
  protection-minutes: 30
  # Porcentagem do XP total guardada no túmulo.
  xp-percent: 100

combat:
  # false = membros do mesmo reino e de reinos aliados não se ferem.
  friendly-fire: false
  # Segundos "em combate" após um golpe (bloqueia viagens por Waystone).
  combat-tag-seconds: 10

# Honra vai de -100 a 100.
#   Desonrado (-30 ou menos): paga o dobro nos Waystones e pode ser caçado sem punição.
#   Honrado (30+) e Glorioso (70+): Gloriosos viajam de graça.
honor:
  activity:
    interval-minutes: 10
    amount: 1
  unjustified-attack: -1
  unjustified-kill: -10
  defense-kill: 3
  dishonored-kill: 5
  betrayal-kill: -25
  alliance-break: -20

# Saída e troca de reino (/reino sair, /reino entrar).
kingdoms:
  # Horas até poder trocar de reino de novo.
  switch-cooldown-hours: 24
  # Quantos dias um traidor fica marcado (matá-lo não é punido).
  traitor-days: 3
  leave:
    # Honra perdida ao trair (mudar de lado para um reino não aliado) e ao virar fora da lei.
    betrayal-honor: -30
    outlaw-honor: -10

# Honra dos reinos (0 a 200, começa em 100 e se recompõe sozinha até o valor inicial).
kingdom-honor:
  regen-per-10-min: 1
  # Perdas causadas por mercenários e por quem abandona o reino.
  mercenary-kill: -3
  theft: -2
  betrayal: -12
  desertion: -4

# Mercenários = jogadores sem reino (foras da lei). A reputação vai de 0 a 100 e os benefícios
# (desconto nos Waystones, bônus nas recompensas) só valem enquanto estão sem reino.
mercenary:
  reputation:
    kill: 3
    bounty-kill: 8
    betrayal: 10
    theft: 4
    # Perda ao morrer; ter a cabeça cobrada por um caçador zera a reputação.
    death-loss-percent: 25
    # Matar a mesma vítima de novo dentro deste prazo não rende reputação.
    victim-cooldown-minutes: 10

# Recompensas pelas cabeças dos mercenários (pagas em itens).
bounty:
  currency: EMERALD
  min: 8
  max: 2304
  # Cada tantas unidades colocadas rendem 1 de reputação ao alvo (até o teto por oferta).
  rep-per-units: 8
  rep-cap-per-placement: 15
  # Honra de quem, sem ser mercenário, cobra uma recompensa.
  hunter-honor: 3

# Pacote de recursos. Por padrão o servidor descobre sozinho o Vertexx-Pack.zip da release mais
# recente do GitHub (baixa, confere e calcula o SHA-1) e o envia aos jogadores. Quem recusar joga
# com o visual vanilla; a cerimônia de entrada tem versão sem o pacote.
resource-pack:
  auto:
    enabled: true
    asset: "Vertexx-Pack.zip"
  # Opcional: um link manual substitui o pacote automático.
  url: ""
  # SHA-1 do arquivo .zip (40 caracteres) do link manual.
  sha1: ""

# Sincronização automática com o GitHub: baixa a release mais recente para plugins/update/
# e o servidor aplica no próximo reinício.
updater:
  enabled: true
  repository: "KoZuuYT/Vertexx"
  check-interval-minutes: 30
  # true = desliga o servidor quando estiver vazio e houver atualização baixada.
  # Só ative se o seu painel/script reinicia o servidor sozinho.
  restart-when-empty: false
