# ─────────────────────────────────────────────────────────────
#  Vertexx — configuração principal
#  Novas opções são adicionadas automaticamente a cada atualização.
# ─────────────────────────────────────────────────────────────

waystones:
  # Um Waystone é criado ao clicar com um Fragmento de Ametista num Lodestone (o nome é digitado no chat).
  # Limite por jogador (-1 = sem limite).
  max-per-player: 3
  name-max-length: 32
  # Tempo de concentração antes do teletransporte (20 ticks = 1 segundo).
  warmup-ticks: 30
  ambient-particles: true
  cost:
    # ITEM | XP_LEVELS | NONE
    type: ITEM
    # Itens aceitos e a quantidade de cada um. Cada jogador escolhe qual usar no menu do Waystone.
    options:
      AMETHYST_SHARD: 1
      ENDER_PEARL: 1
      RESIN_CLUMP: 2
    # Item usado por quem ainda não escolheu.
    default: AMETHYST_SHARD
    # Usado quando type = XP_LEVELS.
    xp-levels: 1
  # Pedra de Warp: abre todos os Waystones já descobertos, sem custo de pérolas, mas com poucas cargas.
  warp-stone:
    charges: 5
  # Modelo 3D (display entities) sobre o Lodestone.
  model:
    enabled: true
    # Distância em blocos para criar o modelo e enviá-lo ao jogador.
    render-distance: 48
    # Sem jogador a esta distância, as entidades são removidas do mundo.
    despawn-distance: 96
    # Não envia o modelo a quem está de costas para ele.
    fov-culling: true
    # Não envia o modelo a quem tem uma parede no meio do caminho.
    occlusion-culling: true
    # Frequência da checagem de visibilidade (ticks).
    check-interval-ticks: 10
    # Animação de montagem ao colocar um novo Waystone.
    assembly-animation: true

graves:
  enabled: true
  # Por quantos minutos só o dono (ou alguém com uma Chave de Túmulo) pode abrir o túmulo.
  protection-minutes: 30
  # Porcentagem do XP total guardada no túmulo.
  xp-percent: 100

mobs:
  # Mobs hostis ganham nivel conforme a distancia do spawn do mundo, a dimensao e as estruturas.
  enabled: true
  # A cada X blocos do spawn (ou do centro do Nether/End) o nivel base sobe 1.
  blocks-per-level: 300
  max-level: 60
  # Bonus de nivel por dimensao.
  dimension-bonus:
    nether: 6
    the-end: 12
  # Bonus abaixo de Y=0 (profundezas do Overworld).
  deep-bonus: 2
  # Multiplicadores por nivel acima do 1 (0.05 = +5% de vida por nivel).
  health-per-level: 0.05
  damage-per-level: 0.02
  xp-per-level: 0.04
  # Limite do multiplicador total de dano (nivel + elite + traits).
  max-damage-multiplier: 4.0
  show-name: true
  show-health: true
  # Chance (0 a 1) de um mob comum nascer com 1 trait; a de um segundo trait e a metade.
  trait-chance: 0.30
  elite:
    # Chance base; estruturas raras multiplicam esse valor.
    chance: 0.04
    scale: 1.2
    health-multiplier: 2.0
    damage-multiplier: 1.3
    xp-multiplier: 3.0
    # Chance de dropar Essencia Elite (usada nos upgrades de fornalhas e baus).
    essence-chance: 0.6

rpg:
  # Status de atividade (mineracao, luta...), nivel geral e arvore de habilidades.
  enabled: true
  xp-multiplier: 1.0
  # Parte do XP de cada atividade que tambem soma no nivel geral.
  general-share: 0.8
  max-level: 100
  max-stat-level: 100
  xp-toast: true
  # Niveis de XP do Minecraft cobrados para redefinir a arvore de habilidades.
  respec-cost-levels: 5
  # Botao direito 2x rapido usa a habilidade ativa; Shift + botao esquerdo (no ar) troca.
  cast-with-shift-click: true

upgrades:
  # Agache e clique com a mao vazia em uma fornalha ou bau para melhora-lo.
  # Cada nivel custa itens (e Essencia Elite nos mais altos).
  enabled: true
  furnace:
    # speed = divisor do tempo de cozimento (2.0 = o dobro da velocidade).
    tiers:
      - {item: COPPER_INGOT, amount: 24, essence: 0, speed: 1.3}
      - {item: GOLD_INGOT, amount: 24, essence: 0, speed: 1.6}
      - {item: AMETHYST_SHARD, amount: 32, essence: 0, speed: 2.0}
      - {item: DIAMOND, amount: 16, essence: 0, speed: 2.7}
      - {item: OBSIDIAN, amount: 32, essence: 3, speed: 3.5}
      - {item: NETHERITE_INGOT, amount: 4, essence: 6, speed: 5.0}
  chest:
    # slots = capacidade total do bau (multiplos de 45; o vanilla tem 27). Vira paginas de 45.
    tiers:
      - {item: COPPER_INGOT, amount: 32, essence: 0, slots: 45}
      - {item: GOLD_INGOT, amount: 32, essence: 0, slots: 90}
      - {item: AMETHYST_SHARD, amount: 48, essence: 0, slots: 135}
      - {item: DIAMOND, amount: 24, essence: 0, slots: 180}
      - {item: OBSIDIAN, amount: 48, essence: 3, slots: 270}
      - {item: NETHERITE_INGOT, amount: 6, essence: 6, slots: 360}

# Pacote de recursos. Por padrão o servidor descobre sozinho o Vertexx-Pack.zip da release mais
# recente do GitHub (baixa, confere e calcula o SHA-1) e o envia aos jogadores. Quem recusar joga
# com o visual vanilla.
resource-pack:
  auto:
    enabled: true
    asset: "Vertexx-Pack.zip"
  # Opcional: um link manual substitui o pacote automático.
  url: ""
  # SHA-1 do arquivo .zip (40 caracteres) do link manual.
  sha1: ""

# Modelos automáticos (estilo ModelEngine, sem comandos): arquivos .bbmodel colocados em
# plugins/Vertexx/blueprints/ viram criaturas com resource pack gerado e enviado sozinho.
blueprints:
  enabled: true
  # Porta TCP do servidor HTTP interno que entrega o pack gerado (libere no firewall/roteador).
  http-port: 8765
  # Endereço que os jogadores usam para baixar o pack. Vazio = server-ip, ou o IP público detectado.
  public-host: ""
  # Consulta api.ipify.org uma vez (sem enviar dados) para descobrir o IP público quando public-host está vazio.
  detect-public-ip: true
  natural-spawn-interval-seconds: 20

# Sincronização automática com o GitHub: baixa a release mais recente para plugins/update/
# e o servidor aplica no próximo reinício.
updater:
  enabled: true
  repository: "KoZuuYT/Vertexx"
  check-interval-minutes: 30
  # true = desliga o servidor quando estiver vazio e houver atualização baixada.
  # Só ative se o seu painel/script reinicia o servidor sozinho.
  restart-when-empty: false

bosses:
  # Bosses com sala propria: Iceologer (Castelo de Gelo, em terras geladas) e Wildfire
  # (Camara do Wildfire, anexa a fortalezas do Nether). As salas sao construidas sozinhas
  # quando um jogador explora a regiao.
  enabled: true
  # Minutos ate o boss voltar depois de derrotado (0 = nunca).
  respawn-minutes: 90
  # Multiplicador de dano de todos os ataques dos bosses.
  damage-multiplier: 1.0
  # XP de Luta concedido a cada participante ao vencer.
  xp-reward: 600
  scan-interval-seconds: 5
  wildfire:
    health: 450
    shockwave-damage: 9
    fireball-damage: 5
    lunge-damage: 8
    graze-damage: 3
    # Chance de cada fortaleza ganhar uma Camara do Wildfire.
    fortress-chance: 0.8
  iceologer:
    health: 380
    spike-damage: 6
    iceberg-damage: 11
    # Tamanho (em blocos) da celula usada para sortear castelos e chance por celula gelada.
    cell-size: 1100
    castle-chance: 0.6
    min-spawn-distance: 500
    min-spacing: 900
  void-scarab:
    # Matriarca de Quitina: chefe do Pinaculo de Quitina, nos Abismos de Enderita do End.
    health: 600
    # Chance (1 em N) por chunk elegivel (a mais de min-radius blocos do centro) de gerar um Pinaculo.
    chunk-odds: 650
    min-radius: 2500
    min-spacing: 400
    # Minutos ate o altar resetar apos a vitoria.
    respawn-minutes: 30

  parched-titan:
    # Colosso de arenito do Deserto: chefe da Cidadela Soterrada (subsolo das dunas).
    health: 360
    # Chance (1 em N) por chunk de deserto de gerar uma Cidadela, distancia minima do spawn e entre cidadelas.
    chunk-odds: 800
    min-spawn-distance: 300
    min-spacing: 700
    respawn-minutes: 90

  gloom-stalker:
    # Predador do Deep Dark: chefe do Covil Ressonante (subsolo, Y -35 a -52, longe de Cidades Antigas).
    health: 420
    chunk-odds: 70
    min-spawn-distance: 250
    min-spacing: 500
    respawn-minutes: 90

  root-sovereign:
    # Guardiao das Lush Caves: chefe da Gruta dos Esporos Ancestrais (subsolo, Y -10 a -45).
    health: 380
    # Chance (1 em N) por chunk de lush caves de gerar uma Gruta, distancia minima do spawn e entre grutas.
    chunk-odds: 60
    min-spawn-distance: 200
    min-spacing: 500
    respawn-minutes: 90

fauna:
  # Criaturas rejeitadas da votacao de mobs: Rascal, Golem de Tufo, Moobloom, Glare, Caranguejo, Pinguim,
  # Great Hunger e Barnacle (monstro das profundezas).
  enabled: true
  spawn-interval-seconds: 12
  rascal:
    enabled: true
    # Chance por verificacao, para jogadores abaixo de Y=0 perto de minas abandonadas.
    chance: 0.12
    # Quantas vezes o jogador precisa achar o Rascal para ganhar o presente.
    finds-needed: 3
  glare:
    enabled: true
    chance: 0.15
  moobloom:
    # Chance base de uma vaca natural virar Moobloom (x1 floresta de flores, x0.4 campo, x0.25 girassois).
    chance: 0.35
  tuff-golem:
    enabled: true
  crab:
    enabled: true
    # Chance por verificacao, para jogadores em manguezais.
    chance: 0.18
    # Blocos extras de alcance para colocar/quebrar blocos com a Garra de Caranguejo na mao.
    claw-reach: 3.0
  penguin:
    enabled: true
    # Chance por verificacao, para jogadores em praias rochosas (nascem em grupos de 2 a 3).
    chance: 0.15
    # Multiplicador de velocidade dos barcos com pinguins nadando por perto.
    boat-boost: 1.12
  great-hunger:
    enabled: true
    # Chance por verificacao, na superficie (a variante segue o bloco do chao).
    chance: 0.04
  barnacle:
    enabled: true
    # Chance por verificacao, para jogadores na agua ou de barco em oceanos profundos.
    chance: 0.05
    # Raio (blocos) do redemoinho.
    radius: 10
    # Se verdadeiro, barcos sugados ate o centro quebram (o barco cai como item).
    break-boats: true
    # Dano (em pontos de vida) de cada mordida em quem chega perto da boca.
    bite-damage: 6
    # Velocidade de natacao (blocos por tick) ao perseguir.
    swim-speed: 0.075

# ───────────────────────── End Update e mochilas ─────────────────────────
end:
  # Itens customizados: "model" é o item_model do resource pack (assets/vertexx/items/<id>.json) e
  # "custom-model-data" o id numerico (para quem prefere ligar os modelos por CustomModelData).
  items:
    enderite_fragment: {model: "vertexx:enderite_fragment", custom-model-data: 1001}
    ethereal_membrane: {model: "vertexx:ethereal_membrane", custom-model-data: 1002}
    void_chitin: {model: "vertexx:void_chitin", custom-model-data: 1003}
    levitation_core: {model: "vertexx:levitation_core", custom-model-data: 1004}
    warp_stone: {model: "vertexx:warp_stone", custom-model-data: 1040}
    backpack_leather: {model: "vertexx:backpack_leather", custom-model-data: 1010}
    backpack_iron: {model: "vertexx:backpack_iron", custom-model-data: 1011}
    backpack_void: {model: "vertexx:backpack_void", custom-model-data: 1012}
  quality:
    # Ao acabar a pilha de blocos na mao, traz outra identica do inventario.
    auto-refill: true
    # Botao do meio em baus e mochilas ordena e junta as pilhas.
    sorter: true
  portal:
    # Portal do End trancado: exige os núcleos dos bosses do Underworld (um de cada) e, por último, um Olho do Ender.
    locked: true
    # Quantos núcleos de boss o portal pede (11; o 12º encaixe é do Olho do Ender comum).
    core-slots: 11
  biomes:
    # Floresta de Dossel do Coro e Abismos de Enderita nas ilhas externas do End (alem de 1000 blocos), em chunks novos.
    enabled: true
  mobs:
    # Arraia do Vazio, Rastejador do Fim e Sentinela de Shulker.
    enabled: true


# ───────────────────────── Overworld Revival ─────────────────────────
# Recarregue com /overworldreload.
overworld:
  curses:
    enabled: true
    chest-chance: 0.06        # chance de um livro de maldição em baús de estruturas
    librarian-chance: 0.25    # chance de um Bibliotecário Mestre oferecer um
    bloodthirst: {damage-multiplier: 1.45, hunger-cost: 1.5}
    fragile-stride: {speed-bonus: 0.3, damage-multiplier: 1.5}
    glass-cannon: {durability-cost: 5}
  climate:
    enabled: true
    chance: 0.18              # chance por clima a cada 20 s (se houver jogador no bioma)
    duration-seconds: 90
  arid:
    generation: true          # oásis, baobás, cupinzeiros, cactos-barril e tumbleweeds em chunks novos
    mobs: true                # suricato, avestruz e abutre
    ostrich-eggs: true
    oasis-chance: 0.025       # por chunk novo de deserto
    baobab-chance: 0.05       # por chunk novo de savana
    termite-chance: 0.06
    cactus-chance: 0.2        # por chunk novo de badlands
    tumbleweed-chance: 0.1
    tumbleweed-cap: 40
    hatch-seconds: 180        # tempo para o ovo de avestruz chocar no feno
  archaeology:
    generation: true          # bolsões de cascalho suspeito em cavernas de deepslate (chunks novos)
    pocket-chance: 0.3
    incubation-seconds: 180   # ciclo da Incubadora Geotérmica

# Decoração: relógio do Minecraft e ganchos de exposição.
decor:
  clock:
    # Segurando um relógio, mostra o dia e a hora do mundo na barra de ação.
    day-counter: true
    # Duração máxima do timer do relógio decorativo, em segundos.
    max-timer-seconds: 3600
  hooks:
    # Botão direito num Tripwire Hook com um item na mão o pendura como exposição.
    enabled: true
