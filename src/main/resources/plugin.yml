name: Vertexx
version: '${version}'
main: dev.vertexx.PluginMain
api-version: '26.3'
description: Plugin customizado do SMP pacífico Vertexx (waystones, túmulos, mobs nivelados, bosses, status e upgrades).
author: KoZuuYT
website: https://github.com/KoZuuYT/Vertexx

commands:
  tumulo:
    description: Lista os seus túmulos pendentes.
    usage: /tumulo [chave|admin|lista|tempo|quebrar|config ...]
    aliases: [tumulos, grave]
  pacote:
    description: Aceita ou recusa o pacote visual opcional.
    usage: /pacote [aceitar|recusar]
  vstats:
    description: Abre o menu de status, habilidades e informações.
    usage: /vstats [status|habilidades|info]
    aliases: [status, skills]
  mochila:
    description: Abre a mochila equipada no peito (ou a primeira que estiver no inventário).
    usage: /mochila
    aliases: [backpack]
  vxp:
    description: Soma, define, multiplica, divide ou diminui o XP e os níveis de um jogador (administradores).
    usage: /vxp <adicionar|definir|multiplicar|dividir|remover> <jogador> <valor> [pontos|niveis|geral|<status>] [nivel|xp]
    aliases: [vexp]
  vbackup:
    description: Backups do servidor (criar, listar, renomear, copiar, apagar e restaurar), só administradores.
    usage: /vbackup [menu|criar|listar|info|renomear|descricao|copiar|apagar|restaurar|cancelar|status]
    aliases: [backup, backups]
  overworldreload:
    description: Recarrega o config.yml do Vertexx (administradores).
    usage: /overworldreload
  vertexx:
    description: Painel do Vertexx (administradores), Guia em livro para todos e atualização pelo GitHub.
    usage: /vertexx [painel|livro|mob|xp|boss|versao|atualizar]

permissions:
  vertexx.admin:
    description: Acesso administrativo ao Vertexx.
    default: op
