name: Vertexx
version: '${version}'
main: dev.vertexx.PluginMain
api-version: '26.3'
description: Plugin customizado do SMP pacífico Vertexx (waystones e túmulos).
author: KoZuuYT
website: https://github.com/KoZuuYT/Vertexx

commands:
  tumulo:
    description: Lista os seus túmulos pendentes.
    usage: /tumulo [chave <jogador> [quantidade]]
    aliases: [tumulos, grave]
  pacote:
    description: Aceita ou recusa o pacote visual opcional.
    usage: /pacote [aceitar|recusar]
  vertexx:
    description: Painel do Vertexx (administradores), Guia em livro para todos e atualização pelo GitHub.
    usage: /vertexx [painel|livro|versao|atualizar]

permissions:
  vertexx.admin:
    description: Acesso administrativo ao Vertexx.
    default: op
