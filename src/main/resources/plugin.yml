name: Vertexx
version: '${version}'
main: dev.vertexx.PluginMain
api-version: '26.3'
description: Plugin customizado do SMP semi-vanilla Vertexx (reinos, waystones, túmulos e honra).
author: KoZuuYT
website: https://github.com/KoZuuYT/Vertexx

commands:
  reino:
    description: Informações e gestão do seu reino.
    usage: /reino [membros|aliar|romper|admin]
    aliases: [reinos, kingdom]
  tumulo:
    description: Lista os seus túmulos pendentes.
    usage: /tumulo [chave <jogador> [quantidade]]
    aliases: [tumulos, grave]
  honra:
    description: Mostra a honra de um jogador.
    usage: /honra [jogador]
    aliases: [honor]
  pacote:
    description: Aceita ou recusa o pacote visual opcional.
    usage: /pacote [aceitar|recusar]
  vertexx:
    description: Versão do plugin e atualização pelo GitHub.
    usage: /vertexx [versao|atualizar]
    permission: vertexx.admin

permissions:
  vertexx.admin:
    description: Acesso administrativo ao Vertexx.
    default: op
